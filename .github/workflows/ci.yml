name: Glodin conformance

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2022]
        otp: ['27', '28', '29']
        odin: [dev-2026-07a, dev-2026-10]
        exclude:
          # October's upstream release has no macOS x64 binary.
          - os: macos-15-intel
            odin: dev-2026-10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: '1.19.1'
      - uses: laytan/setup-odin@v2
        with:
          release: ${{ matrix.odin }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: make check test docs package
        shell: bash
        env:
          CC: clang
      - uses: actions/upload-artifact@v4
        with:
          name: glodin-${{ runner.os }}-${{ runner.arch }}-otp${{ matrix.otp }}-${{ matrix.odin }}
          path: build/glodin-0.1.0.tar
