name: Glodin conformance

on: [push, pull_request]

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
        otp: ['27', '28', '29']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: '1.19.1'
      - uses: laytan/setup-odin@v2
        with:
          release: dev-2026-07a
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: make check test docs package
      - uses: actions/upload-artifact@v4
        with:
          name: glodin-${{ runner.os }}-${{ runner.arch }}-otp${{ matrix.otp }}
          path: build/glodin-0.1.0.tar
