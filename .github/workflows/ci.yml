name: Glodin conformance

on: [push, pull_request]

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
        otp: ['27', '28', '29']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: '1.19.1'
      - uses: laytan/setup-odin@v2
        with:
          release: dev-2026-07a
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools/gleam-target
          key: gleam-1.19.1-hooks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/patch_gleam.py') }}
      - run: make compiler
      - run: make check test
